<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시황 대시보드</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--line:#e3e6eb;--text:#151a22;--muted:#6b7380;
  --up:#d6293e;--down:#1f6fd6;--flat:#7c8591;--accent:#3b5bdb;--shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1116;--panel:#161a21;--panel2:#1d222b;--line:#2a303b;--text:#e8ebf0;--muted:#8a93a2;
  --up:#ff5468;--down:#4c95ff;--flat:#8a93a2;--accent:#7c95ff;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.status{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--flat)}
.dot.ok{background:#22b573}.dot.err{background:var(--up)}.dot.load{background:#f2a516;animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
main{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
section{margin-top:22px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sh h2{font-size:15px;margin:0;font-weight:700}
.sh small{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym{color:var(--muted);font-size:11.5px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.live{color:#22b573;background:color-mix(in srgb,#22b573 14%,transparent)}
.px{font-size:21px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.px .cur{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.chg{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.spark{display:block;width:100%;height:46px;margin-top:6px}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.x{position:absolute;top:6px;right:6px;border:0;background:var(--panel2);color:var(--muted);width:22px;height:22px;border-radius:6px;cursor:pointer;display:none;font-size:14px;line-height:1}
.card:hover .x{display:block}
.err{color:var(--muted);font-size:12px;margin-top:10px}
.skel{height:20px;margin-top:8px;border-radius:6px;background:var(--panel2)}
.add{display:flex;gap:8px;position:relative;flex-wrap:wrap}
.add input{flex:1;min-width:200px;max-width:380px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:8px;font:inherit}
.add input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.sug{position:absolute;top:40px;left:0;width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:4;overflow:hidden;display:none}
.sug div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sug div:hover,.sug div.on{background:var(--panel2)}
.sug b{font-weight:600}.sug span{color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 10px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
/* summary strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pill{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.pill b{font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.on{display:flex}
.modal{background:var(--panel);border-radius:14px;width:min(980px,100%);max-height:94vh;overflow:auto;padding:18px 20px}
.mh{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mh .px{margin:0;font-size:28px}
.big{width:100%;height:340px;display:block;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.stats small{display:block;color:var(--muted);font-size:11.5px}
.stats b{font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none}
.src{color:var(--muted);font-size:11.5px;margin-top:30px;text-align:center}
@media (max-width:600px){.bar{padding:10px 16px}main{padding:12px 16px 40px}.grid{grid-template-columns:1fr 1fr}.px{font-size:18px}.big{height:240px}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>📈 시황 대시보드</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">불러오는 중…</span></div>
  <div class="spacer"></div>
  <div class="seg" id="ranges"></div>
  <button class="btn" id="refresh" title="지금 새로고침">↻ 새로고침</button>
</div></header>

<main>
  <div class="strip" id="strip"></div>
  <div id="groups"></div>

  <section id="watch">
    <div class="sh"><h2>⭐ 내 관심종목</h2><small id="wcount"></small></div>
    <div class="add">
      <input id="q" placeholder="종목명 또는 티커 검색 (예: AAPL, Tesla, 005930.KS)" autocomplete="off">
      <button class="btn" id="addBtn">추가</button>
      <div class="sug" id="sug"></div>
    </div>
    <div class="hint">한국 종목은 종목코드 뒤에 코스피 <b>.KS</b> / 코스닥 <b>.KQ</b>를 붙여요 (삼성전자 005930.KS, 에코프로비엠 247540.KQ). 목록은 각자의 브라우저에 저장돼요.</div>
    <div class="grid" id="wgrid"></div>
  </section>

  <div class="src">데이터: Yahoo Finance (비공식 API) · 한국 시장 약 20분, 선물 10~15분 지연될 수 있음 · 1분마다 자동 갱신 · 투자 판단의 근거로 사용하지 마세요</div>
</main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="tip" id="tip"></div>

<script>
const GROUPS = [
  {id:'kr', title:'국내 증시·환율', items:[['^KS11','코스피'],['^KQ11','코스닥'],['^KS200','코스피 200'],['KRW=X','원/달러 환율']]},
  {id:'us', title:'해외 증시', items:[['^IXIC','나스닥 종합'],['^NDX','나스닥 100'],['^GSPC','S&P 500'],['^DJI','다우존스'],['^SOX','필라델피아 반도체'],['^N225','니케이 225'],['000001.SS','상해종합'],['^VIX','VIX 변동성']]},
  {id:'etf', title:'주요 ETF', items:[['SPY','SPDR S&P 500'],['QQQ','Invesco QQQ'],['SOXX','iShares 반도체'],['TLT','미국채 20년+'],['GLD','SPDR 금'],['069500.KS','KODEX 200'],['360750.KS','TIGER 미국S&P500'],['133690.KS','TIGER 미국나스닥100']]},
  {id:'cmd', title:'원자재·금리·달러', items:[['GC=F','금 (온스)'],['SI=F','은 (온스)'],['CL=F','WTI 원유'],['BZ=F','브렌트유'],['NG=F','천연가스'],['HG=F','구리'],['^TNX','미국 10년물 금리'],['DX-Y.NYB','달러 인덱스']]},
];
const STRIP = ['^KS11','^IXIC','^GSPC','KRW=X','GC=F','CL=F'];
const RANGES = [['1d','1일'],['5d','5일'],['1mo','1개월'],['6mo','6개월'],['1y','1년'],['5y','5년']];
const LS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const SS = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let range = LS('dash.range') || '1d';
let watch = LS('dash.watch') || [['NVDA','엔비디아'],['005930.KS','삼성전자'],['000660.KS','SK하이닉스']];
const data = {};
const labels = {};
GROUPS.forEach(g => g.items.forEach(([s,n]) => labels[s]=n));

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d) => v==null||isNaN(v) ? '–' : v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const digits = (s, v) => (s==='KRW=X'||s.endsWith('.KS')||s.endsWith('.KQ')) && v>=1000 ? (s==='KRW=X'?2:0) : (v>=1000?2: v>=10?2:3);
const cls = v => v>0?'up':v<0?'down':'flat';
const sign = v => v>0?'▲':v<0?'▼':'';

function chg(d){
  if (!d || d.price==null || d.prevClose==null) return null;
  const a = d.price - d.prevClose; return {a, p: a/d.prevClose*100};
}
function periodChg(d){
  const base = range==='1d' ? d.prevClose : d.close?.[0];
  if (d.price==null || !base) return null;
  return (d.price-base)/base*100;
}
function isOpen(d){
  const now = Date.now()/1000;
  return d.tradingStart && d.tradingEnd && now>=d.tradingStart && now<=d.tradingEnd && (now - (d.marketTime||0)) < 3600;
}
function timeStr(t, tz){
  if(!t) return '';
  try { return new Date(t*1000).toLocaleString('ko-KR',{timeZone:tz||undefined, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}); }
  catch { return new Date(t*1000).toLocaleString('ko-KR'); }
}

function spark(d, w=230, h=46){
  const c = d.close||[]; if (c.length<2) return '<svg class="spark"></svg>';
  let base = range==='1d' ? d.prevClose : null;
  let mn = Math.min(...c), mx = Math.max(...c);
  if (base!=null){ mn=Math.min(mn,base); mx=Math.max(mx,base); }
  const pad=3, sx = (w)/(c.length-1), sy = mx===mn?0:(h-pad*2)/(mx-mn);
  const pts = c.map((v,i)=>[i*sx, h-pad-(v-mn)*sy]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const col = `var(--${cls(periodChg(d)??0)})`;
  const id = 'g'+Math.random().toString(36).slice(2,8);
  const bl = base!=null ? `<line x1="0" x2="${w}" y1="${(h-pad-(base-mn)*sy).toFixed(1)}" y2="${(h-pad-(base-mn)*sy).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="2 3" stroke-width="1" opacity=".6"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${bl}<path d="${line}L${w},${h}L0,${h}Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function card(sym, name, removable){
  const d = data[sym];
  const x = removable ? `<button class="x" data-rm="${esc(sym)}" title="삭제">×</button>` : '';
  if (!d) return `<div class="card">${x}<div class="nm">${esc(name)}</div><div class="sym">${esc(sym)}</div><div class="skel"></div><div class="skel" style="height:40px"></div></div>`;
  if (d.error) return `<div class="card">${x}<div class="nm">${esc(name)}</div><div class="sym">${esc(sym)}</div><div class="err">데이터를 불러오지 못했어요 (${esc(d.error).slice(0,60)})</div></div>`;
  const c = chg(d), pc = periodChg(d), dg = digits(sym, d.price);
  const open = isOpen(d);
  return `<div class="card" data-sym="${esc(sym)}">${x}
    <div class="top"><div style="min-width:0"><div class="nm">${esc(name||d.name)}</div><div class="sym">${esc(sym)} · ${esc(d.exchange||'')}</div></div>
    ${removable?'':`<span class="tag ${open?'live':''}">${open?'장중':'장마감'}</span>`}</div>
    <div class="px">${fmt(d.price,dg)}<span class="cur">${esc(d.currency||'')}</span></div>
    <div class="chg ${cls(c?.a)}">${c?`${sign(c.a)} ${fmt(Math.abs(c.a),dg)} (${c.p>0?'+':''}${fmt(c.p,2)}%)`:'–'}</div>
    ${spark(d)}
    <div class="foot"><span>${RANGES.find(r=>r[0]===range)[1]} <b class="${cls(pc)}">${pc==null?'–':(pc>0?'+':'')+fmt(pc,2)+'%'}</b></span><span>${timeStr(d.marketTime,d.tz)}</span></div>
  </div>`;
}

function render(){
  $('groups').innerHTML = GROUPS.map(g => `<section><div class="sh"><h2>${g.title}</h2></div><div class="grid">${g.items.map(([s,n])=>card(s,n,false)).join('')}</div></section>`).join('');
  $('wgrid').innerHTML = watch.length ? watch.map(([s,n])=>card(s,n,true)).join('') : '<div class="empty">아직 관심종목이 없어요. 위 검색창에서 추가해 보세요.</div>';
  $('wcount').textContent = watch.length ? watch.length+'개' : '';
  $('strip').innerHTML = STRIP.map(s => { const d=data[s], c=chg(d); return `<div class="pill" data-sym="${s}"><span>${labels[s]}</span><b>${d&&!d.error?fmt(d.price,digits(s,d.price)):'–'}</b><span class="${cls(c?.p)}">${c?(c.p>0?'+':'')+fmt(c.p,2)+'%':''}</span></div>`; }).join('');
  if (openSym) renderModal();
}

function allSymbols(){ return [...new Set([...GROUPS.flatMap(g=>g.items.map(i=>i[0])), ...watch.map(w=>w[0])])]; }

let loading = false;
async function load(syms){
  syms = syms || allSymbols();
  if (loading && !arguments.length) return;
  loading = true; $('dot').className='dot load'; $('stat').textContent='갱신 중…';
  try {
    const chunks = []; for (let i=0;i<syms.length;i+=16) chunks.push(syms.slice(i,i+16));
    const res = await Promise.all(chunks.map(c => fetch(`/api/batch?range=${range}&symbols=${encodeURIComponent(c.join(','))}`).then(r=>r.json())));
    let errs = 0;
    res.forEach(r => Object.entries(r.data||{}).forEach(([k,v]) => { data[k]=v; if (v.error) errs++; }));
    $('dot').className = 'dot ' + (errs===syms.length ? 'err' : 'ok');
    $('stat').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR',{hour12:false}) + (errs?` · ${errs}개 실패`:'') + ' · 1분마다 자동';
  } catch(e) {
    $('dot').className='dot err'; $('stat').textContent='데이터 서버 연결 실패 — 잠시 후 다시 시도해 주세요';
  }
  loading = false; render();
}

// ranges
$('ranges').innerHTML = RANGES.map(([k,l])=>`<button data-r="${k}" class="${k===range?'on':''}">${l}</button>`).join('');
$('ranges').onclick = e => { const r=e.target.dataset.r; if(!r||r===range) return; range=r; SS('dash.range',r);
  [...$('ranges').children].forEach(b=>b.classList.toggle('on',b.dataset.r===r)); Object.keys(data).forEach(k=>delete data[k]); render(); load(); };
$('refresh').onclick = () => load();

// clicks
document.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm){ e.stopPropagation(); watch = watch.filter(w=>w[0]!==rm.dataset.rm); SS('dash.watch',watch); render(); return; }
  const c = e.target.closest('[data-sym]');
  if (c && !e.target.closest('.modal')) openModal(c.dataset.sym);
});

// watchlist add + search
let sugItems = [], sugIdx = -1, st;
function addSym(sym, name){
  sym = sym.trim().toUpperCase(); if(!sym) return;
  if (!watch.some(w=>w[0]===sym)) { watch.push([sym, name||sym]); SS('dash.watch',watch); }
  $('q').value=''; hideSug(); render(); load([sym]);
}
function hideSug(){ $('sug').style.display='none'; sugItems=[]; sugIdx=-1; }
function showSug(){
  if(!sugItems.length) return hideSug();
  $('sug').innerHTML = sugItems.map((s,i)=>`<div data-i="${i}" class="${i===sugIdx?'on':''}"><b>${esc(s.symbol)} <span>${esc(s.name)}</span></b><span>${esc(s.exchange||'')} ${esc(s.type||'')}</span></div>`).join('');
  $('sug').style.display='block';
}
$('q').oninput = () => { clearTimeout(st); const v=$('q').value.trim(); if(!v) return hideSug();
  st = setTimeout(async()=>{ try{ const r=await fetch('/api/search?q='+encodeURIComponent(v)).then(r=>r.json()); if($('q').value.trim()!==v) return; sugItems=r.results||[]; sugIdx=-1; showSug(); }catch{} }, 250); };
$('q').onkeydown = e => {
  if (e.key==='ArrowDown'){ sugIdx=Math.min(sugIdx+1,sugItems.length-1); showSug(); e.preventDefault(); }
  else if (e.key==='ArrowUp'){ sugIdx=Math.max(sugIdx-1,0); showSug(); e.preventDefault(); }
  else if (e.key==='Enter'){ const s=sugItems[sugIdx]; s?addSym(s.symbol,s.name):addSym($('q').value); }
  else if (e.key==='Escape') hideSug();
};
$('sug').onclick = e => { const d=e.target.closest('[data-i]'); if(d){ const s=sugItems[+d.dataset.i]; addSym(s.symbol,s.name);} };
$('addBtn').onclick = () => addSym($('q').value);
document.addEventListener('click', e => { if(!e.target.closest('.add')) hideSug(); });

// modal
let openSym = null;
function nameOf(s){ return labels[s] || (watch.find(w=>w[0]===s)||[])[1] || data[s]?.name || s; }
function openModal(s){ openSym=s; $('ov').classList.add('on'); renderModal(); }
function closeModal(){ openSym=null; $('ov').classList.remove('on'); }
$('ov').onclick = e => { if(e.target===$('ov')) closeModal(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function renderModal(){
  const s=openSym, d=data[s]; if(!d) return;
  const dg=digits(s,d.price), c=chg(d), pc=periodChg(d);
  $('modal').innerHTML = `
   <div class="mh"><div style="flex:1;min-width:200px"><div class="nm" style="font-size:18px">${esc(nameOf(s))}</div><div class="sym">${esc(s)} · ${esc(d.name)} · ${esc(d.exchange||'')}</div></div>
   <div class="seg" id="mr">${RANGES.map(([k,l])=>`<button data-r="${k}" class="${k===range?'on':''}">${l}</button>`).join('')}</div>
   <button class="btn" id="mclose">닫기</button></div>
   <div style="margin-top:10px"><span class="px">${fmt(d.price,dg)}<span class="cur">${esc(d.currency||'')}</span></span>
   <span class="chg ${cls(c?.a)}" style="margin-left:10px;font-size:15px">${c?`${sign(c.a)} ${fmt(Math.abs(c.a),dg)} (${c.p>0?'+':''}${fmt(c.p,2)}%)`:''}</span>
   <span class="sym" style="margin-left:10px">${timeStr(d.marketTime,d.tz)} 기준</span></div>
   <div style="position:relative">${d.error?'<div class="err">데이터 없음</div>':bigChart(d)}</div>
   <div class="stats">
     <div><small>전일 종가</small><b>${fmt(d.prevClose,dg)}</b></div>
     <div><small>당일 고가 / 저가</small><b>${fmt(d.dayHigh,dg)} / ${fmt(d.dayLow,dg)}</b></div>
     <div><small>52주 최고</small><b>${fmt(d.high52,dg)}</b></div>
     <div><small>52주 최저</small><b>${fmt(d.low52,dg)}</b></div>
     <div><small>기간 등락 (${RANGES.find(r=>r[0]===range)[1]})</small><b class="${cls(pc)}">${pc==null?'–':(pc>0?'+':'')+fmt(pc,2)+'%'}</b></div>
     <div><small>52주 고점 대비</small><b>${d.high52?fmt((d.price/d.high52-1)*100,2)+'%':'–'}</b></div>
   </div>`;
  $('mclose').onclick = closeModal;
  $('mr').onclick = e => { const r=e.target.dataset.r; if(r && r!==range){ $('ranges').querySelector(`[data-r="${r}"]`).click(); } };
  const svg = $('modal').querySelector('svg.big'); if (svg) hookTip(svg, d, dg);
}

function bigChart(d){
  const c=d.close||[], W=940, H=340, L=8, R=70, T=12, B=26;
  if (c.length<2) return '<div class="err">차트 데이터가 부족해요</div>';
  let mn=Math.min(...c), mx=Math.max(...c); const base = range==='1d'?d.prevClose:null;
  if(base!=null){mn=Math.min(mn,base);mx=Math.max(mx,base);}
  const padv=(mx-mn)*.06||1; mn-=padv; mx+=padv;
  const x=i=>L+i*(W-L-R)/(c.length-1), y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  const line=c.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
  const col=`var(--${cls(periodChg(d)??0)})`, dg=digits(d.symbol,d.price);
  let grid=''; for(let k=0;k<=4;k++){ const v=mn+(mx-mn)*k/4, yy=y(v).toFixed(1);
    grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-R+6}" y="${+yy+4}" font-size="11" fill="var(--muted)">${fmt(v,dg)}</text>`; }
  let xl=''; const n=5; for(let k=0;k<n;k++){ const i=Math.round(k*(c.length-1)/(n-1)); xl+=`<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${k===0?'start':k===n-1?'end':'middle'}">${axisLabel(d.ts[i],d.tz)}</text>`; }
  const bl = base!=null?`<line x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${L+4}" y="${y(base)-4}" font-size="10.5" fill="var(--muted)">전일 종가</text>`:'';
  return `<svg class="big" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-w="${W}" data-l="${L}" data-r="${R}">
   <defs><linearGradient id="bg1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   ${grid}${xl}${bl}<path d="${line}L${x(c.length-1)},${H-B}L${L},${H-B}Z" fill="url(#bg1)"/>
   <path d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <line id="cx" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
   <circle id="cd" r="4" fill="${col}" style="display:none"/></svg>`;
}
function axisLabel(t,tz){
  const o = range==='1d' ? {hour:'2-digit',minute:'2-digit',hour12:false} : range==='5d' ? {month:'numeric',day:'numeric',hour:'2-digit',hour12:false} : range==='5y'||range==='1y' ? {year:'2-digit',month:'numeric'} : {month:'numeric',day:'numeric'};
  try { return new Date(t*1000).toLocaleString('ko-KR',{...o,timeZone:tz||undefined}); } catch { return ''; }
}
function hookTip(svg, d, dg){
  const W=940,H=340,L=8,R=70,T=12,B=26, c=d.close, tip=$('tip');
  let mn=Math.min(...c), mx=Math.max(...c); const base=range==='1d'?d.prevClose:null;
  if(base!=null){mn=Math.min(mn,base);mx=Math.max(mx,base);} const padv=(mx-mn)*.06||1; mn-=padv; mx+=padv;
  svg.onmousemove = e => {
    const r=svg.getBoundingClientRect(), fx=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(c.length-1,Math.round((fx-L)/(W-L-R)*(c.length-1))));
    const xx=L+i*(W-L-R)/(c.length-1), yy=T+(mx-c[i])*(H-T-B)/(mx-mn);
    const cx=svg.querySelector('#cx'), cd=svg.querySelector('#cd');
    cx.setAttribute('x1',xx); cx.setAttribute('x2',xx); cx.style.display=''; cd.setAttribute('cx',xx); cd.setAttribute('cy',yy); cd.style.display='';
    const ref = base ?? c[0];
    tip.innerHTML = `${timeStr(d.ts[i],d.tz)} · <b>${fmt(c[i],dg)}</b> (${((c[i]/ref-1)*100).toFixed(2)}%)`;
    tip.style.display='block'; tip.style.left=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8)+'px'; tip.style.top=(e.clientY-34)+'px';
  };
  svg.onmouseleave = () => { tip.style.display='none'; svg.querySelector('#cx').style.display='none'; svg.querySelector('#cd').style.display='none'; };
}

render(); load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
